<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens lifted verbatim from the Lucius AI Design System (colors_and_type.css).
   Motion follows its stated rule: quiet, fintech-y, no bounces. */
:root{
  --bg-0:#07090f; --bg-1:#0a0f1a; --bg-2:#0e1422; --bg-3:#131b2e;
  --fg-1:#f5f7fb; --fg-2:#c8cfdd; --fg-3:#8a93a6; --fg-4:#5b637a;
  --border-1:rgba(255,255,255,.06); --border-2:rgba(255,255,255,.10);
  --brand-violet:#7c5cff; --brand-indigo:#5b6cff; --brand-fuchsia:#b14cff;
  --gradient-brand:linear-gradient(135deg,#5b6cff 0%,#7c5cff 45%,#b14cff 100%);
  --success:#10b981; --warning:#f5a524;
  --font-sans:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --tracking-display:-.035em; --tracking-overline:.16em;
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --radius-lg:14px; --radius-xl:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg-1);width:1920px;height:1080px;overflow:hidden}

.stage{width:1920px;height:1080px;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-sans);color:var(--fg-1);padding:110px;
  background:linear-gradient(180deg,#0a0f1a 0%,#0e1422 100%);
  -webkit-font-smoothing:antialiased}

/* Brand hero radial, slowly alive. Transform-only → compositor-interpolated,
   continuous, never integer-steps the way ffmpeg zoompan does. */
.stage::before{content:'';position:absolute;inset:-30%;
  background:
    radial-gradient(52% 46% at 78% 16%,rgba(177,76,255,.26),transparent 58%),
    radial-gradient(48% 42% at 18% 84%,rgba(91,108,255,.20),transparent 62%);
  animation:drift 34s var(--ease-out) infinite alternate;will-change:transform}
@keyframes drift{
  0%{transform:translate3d(-2.2%,-1.6%,0) scale(1.00)}
  100%{transform:translate3d(2.2%,1.6%,0) scale(1.14)}}

.grid{position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:72px 72px;animation:pan 48s linear infinite}
@keyframes pan{from{background-position:0 0}to{background-position:72px 72px}}

.inner{position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;width:100%;
  animation:breathe 38s var(--ease-out) infinite alternate;will-change:transform}
@keyframes breathe{0%{transform:scale(1.000)}100%{transform:scale(1.028)}}

h1{font-size:132px;font-weight:800;letter-spacing:var(--tracking-display);
  line-height:1.05;background:var(--gradient-brand);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 11s var(--ease-out) infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

h2{font-size:78px;font-weight:700;letter-spacing:var(--tracking-display);
  line-height:1.14;text-align:center;color:var(--fg-1)}
.sub{font-size:38px;color:var(--fg-2);margin-top:36px;text-align:center;
  line-height:1.45;max-width:1400px}
.kicker{font-size:22px;letter-spacing:var(--tracking-overline);
  text-transform:uppercase;color:var(--fg-3);margin-bottom:36px;font-weight:500}

.logo{margin-bottom:44px}

.row{display:flex;gap:24px;margin-top:70px}
.chip{background:var(--bg-2);border:1px solid var(--border-1);
  border-radius:var(--radius-xl);padding:28px 34px;min-width:296px;text-align:left}
.chip .n{font-size:18px;font-weight:600;letter-spacing:.12em;
  background:var(--gradient-brand);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.chip .t{font-size:36px;font-weight:700;margin-top:10px;letter-spacing:-.015em}
.chip .d{font-size:21px;color:var(--fg-3);margin-top:8px}
.chip.hl{border-color:rgba(124,92,255,.42);background:rgba(124,92,255,.09)}

.stack{display:flex;flex-direction:column;gap:22px;margin-top:60px}
.line{display:flex;align-items:center;gap:22px;font-size:34px;color:var(--fg-1)}
.line .b{color:var(--success);font-size:34px}

.quote{background:var(--bg-2);border:1px solid var(--border-1);
  border-left:4px solid var(--warning);border-radius:var(--radius-lg);
  padding:40px 48px;font-family:var(--font-mono);font-size:30px;line-height:1.62;
  color:var(--fg-2);max-width:1500px;margin-top:58px;text-align:left}
.quote .k{color:var(--warning)}
.quote .c{color:var(--brand-violet)}

.foot{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  font-size:25px;color:var(--fg-4);font-family:var(--font-mono);
  white-space:nowrap;z-index:2}

/* Entrance — opacity + translate only. Quiet ease, no overshoot, per the
   design system's motion note. */
.r{opacity:0;transform:translate3d(0,30px,0);
  animation:rise 1s var(--ease-out) forwards;will-change:transform,opacity}
@keyframes rise{to{opacity:1;transform:translate3d(0,0,0)}}
.d1{animation-delay:.12s}.d2{animation-delay:.36s}.d3{animation-delay:.60s}
.d4{animation-delay:.84s}.d5{animation-delay:1.08s}.d6{animation-delay:1.32s}
.foot.r{transform:translate3d(-50%,30px,0)}
@keyframes riseFoot{to{opacity:1;transform:translate3d(-50%,0,0)}}
.foot.r{animation-name:riseFoot}
</style>
</head>
<body>
<div class="stage"><div class="grid"></div><div class="inner" id="inner"></div></div>
<script>
const LOGO = `<svg width="150" height="150" viewBox="0 0 80 80" fill="none">
  <defs><linearGradient id="lg" x1="6" y1="6" x2="74" y2="74" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#5B6CFF"/><stop offset="50%" stop-color="#7C5CFF"/>
    <stop offset="100%" stop-color="#B14CFF"/></linearGradient></defs>
  <path d="M14 8 H30 V58 H56 V72 H14 Z" fill="url(#lg)" opacity="0.55"/>
  <path d="M22 16 H38 V64 H64 V78 H22 Z" fill="url(#lg)"/></svg>`;

const CARDS={
 c0:`<div class="logo r d1">${LOGO}</div>
     <h1 class="r d2">CinemaForge</h1>
     <div class="sub r d3">A content studio that decides what to make<br>from telemetry, not from a guess.</div>
     <div class="foot r d5">Gemini &nbsp;·&nbsp; Agent Development Kit &nbsp;·&nbsp; Grafana Cloud MCP &nbsp;·&nbsp; Cloud Run</div>`,

 c1:`<div class="kicker r d1">Sequential agent pipeline</div>
     <h2 class="r d2">Four agents, one handoff chain</h2>
     <div class="row">
       <div class="chip hl r d3"><div class="n">01</div><div class="t">Analyst</div><div class="d">Queries Grafana via MCP</div></div>
       <div class="chip r d4"><div class="n">02</div><div class="t">Writer</div><div class="d">Script from the brief</div></div>
       <div class="chip r d5"><div class="n">03</div><div class="t">Director</div><div class="d">Shot list and thumbnail</div></div>
       <div class="chip r d6"><div class="n">04</div><div class="t">SEO</div><div class="d">Title, tags, metadata</div></div>
     </div>`,

 c2:`<div class="kicker r d1">The grounding step</div>
     <h2 class="r d2">The analyst runs live PromQL<br>before a word is written</h2>
     <div class="quote r d4">
<span class="k">mcp-grafana</span> · stdio<br>
<span class="c">query_prometheus</span>(datasource=<span class="k">"grafanacloud-prom"</span>)<br><br>
sum(productions_completed_total{topic="…"})<br>
sum(agent_duration_seconds_sum) by (agent)</div>`,

 c3:`<div class="kicker r d1">The honesty guard</div>
     <h2 class="r d2">When there is no data,<br>it says there is no data</h2>
     <div class="quote r d4">
"data_source": <span class="k">"unavailable"</span>,<br>
"productions_recorded": <span class="k">0</span>,<br>
"note": "There are NO historical performance<br>&nbsp;&nbsp;figures to cite <span class="k">- do not invent any.</span>"</div>
     <div class="sub r d6" style="margin-top:44px;font-size:32px">Every figure in a brief traces to a query that actually ran.</div>`,

 c4:`<div class="kicker r d1">Closing the loop</div>
     <h2 class="r d2">Every run measures itself</h2>
     <div class="stack">
       <div class="line r d3"><span class="b">→</span> OpenTelemetry metrics, tagged by topic</div>
       <div class="line r d4"><span class="b">→</span> Straight into Grafana Cloud Prometheus</div>
       <div class="line r d5"><span class="b">→</span> The next run queries them back through MCP</div>
     </div>`,

 c5:`<div class="logo r d1">${LOGO}</div>
     <h1 class="r d2">CinemaForge</h1>
     <div class="sub r d3" style="margin-top:28px">Open source, Apache 2.0</div>
     <div class="stack r d4" style="gap:14px;margin-top:42px">
       <div class="line" style="font-family:var(--font-mono);font-size:29px;color:var(--fg-2)">github.com/downoff/cinemaforge</div>
       <div class="line" style="font-family:var(--font-mono);font-size:29px;color:var(--fg-2)">cinemaforge-384599766402.us-central1.run.app</div>
     </div>
     <div class="foot r d6">Built for Agentic Cinema &nbsp;·&nbsp; Grafana track</div>`,
};
const inner = document.getElementById('inner');
inner.innerHTML = CARDS[new URLSearchParams(location.search).get('card')] || CARDS.c0;
// .foot is position:absolute, but .inner carries a scale() animation, which
// makes it the containing block — so bottom:80px resolved against .inner's
// box and the footer landed on top of the subtitle. Reparent it to .stage.
const foot = inner.querySelector('.foot');
if (foot) document.querySelector('.stage').appendChild(foot);
</script>
</body>
</html>
