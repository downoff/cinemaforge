<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* The real Grafana dashboard screenshot, given a slow continuous drift so the
   24s it occupies is no longer a frozen frame. Transform-only, composited. */
:root{--bg-1:#14120F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg-1);width:1920px;height:1080px;overflow:hidden}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 30%,#181510 0%,#14120F 60%,#100E0B 100%)}
/* The source screenshot is only 1568x775. It was previously laid out at
   2040px, which both upscaled it 1.3x and pushed 60px off each side before
   the animation even started; the push then took ~116px. That cropped the
   panel titles ("Latency per agent" read as "atency per agent") and, worse,
   the agent names beside the bars - exactly what the narration points at
   when it says the analyst is the slowest agent. Fit the frame instead.
   1840 * 1.028 = 1891px wide, inside 1920, so nothing ever leaves frame. */
.shot{position:absolute;top:50%;left:50%;width:1840px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  animation:glide 30s cubic-bezier(.22,.61,.36,1) infinite alternate;
  will-change:transform}
@keyframes glide{
  0%  {transform:translate(-50.4%,-49.7%) scale(1.000)}
  100%{transform:translate(-49.6%,-50.3%) scale(1.028)}
}
/* Vignette now only settles the eye; it no longer has crop edges to hide,
   so it is lighter and starts further out to keep the panels legible. */
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 70% at 50% 50%,transparent 58%,rgba(7,9,15,.42) 100%)}
</style>
</head>
<body>
<div class="stage">
  <img class="shot" src="cards/grafana_dash_2x.png" alt="">
  <div class="vig"></div>
</div>
</body>
</html>
