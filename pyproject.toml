[project]
name = "cinemaforge"
version = "0.1.0"
description = "AI multi-agent content production studio with Grafana-powered analytics"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.6",
    "google-genai>=2.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "mcp>=1.0",
    "mcp-grafana",
    "opentelemetry-api>=1.42",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
